name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar JSON de escenas
        run: node -e "JSON.parse(require('fs').readFileSync('data/questions.json','utf8'))"
      - name: Pruebas
        run: node --test
